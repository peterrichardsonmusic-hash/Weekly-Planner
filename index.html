<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Week Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#1c2430;--mute:#66707f;--line:#d6dce5;--empty:#f6f8fb;--sel:#1c2430;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--panel:#1b212b;--ink:#e8ecf2;--mute:#929cac;--line:#2e3744;--empty:#161b23;--sel:#e8ecf2}}
:root[data-theme="dark"]{--bg:#12161c;--panel:#1b212b;--ink:#e8ecf2;--mute:#929cac;--line:#2e3744;--empty:#161b23;--sel:#e8ecf2}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Outfit,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:16px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em}
.hint{color:var(--mute);font-size:14px}
header .sp{flex:1}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px}
.bar-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-top b{font-weight:600}
.pal{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:2px solid transparent;cursor:grab;user-select:none;background:color-mix(in srgb,var(--c) 22%,var(--panel));box-shadow:inset 4px 0 0 var(--c)}
.chip.sel{border-color:var(--sel)}
.chip .e{font-size:20px}
.edit-row{display:flex;align-items:center;gap:8px;width:100%;flex-wrap:wrap}
.edit-row input[type=text]{border:1px solid var(--line);background:var(--empty);color:inherit;border-radius:8px;padding:6px 8px;font:inherit}
.edit-row .em{width:56px;text-align:center;font-size:18px}
.edit-row .nm{flex:1;min-width:160px}
.edit-row input[type=color]{width:40px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--panel)}
.scroll{overflow-x:auto;border-radius:12px}
.grid{display:grid;grid-template-columns:84px repeat(7,minmax(98px,1fr));gap:6px;min-width:780px}
.dh{font-weight:600;text-align:center;padding:6px 0}
.sh{color:var(--mute);font-size:13px;display:flex;align-items:center;padding-right:4px}
.cell{min-height:62px;border-radius:10px;border:1px dashed var(--line);background:var(--empty);display:flex;align-items:center;justify-content:center;padding:4px;text-align:center;cursor:pointer}
.cell.over{border-color:var(--sel);border-style:solid}
.cell.full{border:1px solid transparent;background:color-mix(in srgb,var(--c) 26%,var(--panel));box-shadow:inset 0 -4px 0 var(--c);cursor:grab}
.cell .e{font-size:22px;display:block;line-height:1.1}
.cell .n{font-size:11.5px;color:var(--mute);display:block;margin-top:2px}
.stats{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stats h2{font-size:16px;margin:0 0 10px;font-weight:600}
.srow{display:grid;grid-template-columns:minmax(120px,220px) 1fr 52px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.track{height:12px;border-radius:6px;background:var(--empty);overflow:hidden}
.fill{height:100%;background:var(--c);border-radius:6px;transition:width .2s}
.srow span:last-child{text-align:right;color:var(--mute)}
.cell{position:relative}
.cell .nt{display:none}
.cell .nb{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.3;margin-top:5px;padding-top:5px;border-top:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--ink);text-align:left;overflow-wrap:anywhere}
.cell .nt{position:absolute;top:3px;right:5px;font-size:12px}
.pl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pl label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mute);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(440px,100%)}
.modal textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--empty);color:inherit;border-radius:8px;padding:8px;font:inherit;resize:vertical}
.mb{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.tab{padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:10px;border-width:2px}
.tab.on{border-color:var(--sel)}
.dots{display:flex;flex-direction:column;gap:3px}
.dots i{display:block;width:16px;height:5px;border-radius:3px}
.dtitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dtitle b{font-size:20px;font-weight:600}
.dtitle button{width:48px;height:44px;font-size:20px}
.mrow{margin-bottom:12px}
.ml{color:var(--mute);font-size:13px;margin-bottom:4px}
.mcell{min-height:68px;border-radius:12px;border:1px dashed var(--line);background:var(--empty);display:flex;align-items:center;gap:12px;padding:10px 14px;color:var(--mute);cursor:pointer}
.mcell.full{border:1px solid transparent;background:color-mix(in srgb,var(--c) 26%,var(--panel));box-shadow:inset 0 -4px 0 var(--c);color:var(--ink)}
.mcell .e{font-size:30px;line-height:1}
.mn{font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.pbtn{display:flex;width:100%;gap:12px;align-items:center;padding:14px;margin-bottom:8px;font-size:16px;border-radius:10px;background:color-mix(in srgb,var(--c) 22%,var(--panel));box-shadow:inset 4px 0 0 var(--c);text-align:left}
.pbtn .e{font-size:22px}
.modal.sheet{align-items:flex-end;padding:0}
.modal.sheet .box{border-radius:16px 16px 0 0;max-height:85vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (max-width:700px){
 .wrap{padding:12px 12px 32px}
 h1{font-size:22px}
 .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
 .bar:has(.pal.ed){position:static}
 .pal{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
 .pal.ed{flex-direction:column;overflow:visible;flex-wrap:wrap}
 .chip{flex:0 0 auto;min-height:44px;padding:8px 12px}
 .srow{grid-template-columns:1fr 1fr 46px}
 input[type=text],textarea{font-size:16px}
 .edit-row .nm{min-width:0}
}
.wk{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.wk b{font-size:17px;font-weight:600;min-width:170px;text-align:center}
.wk button{min-height:40px}
button:disabled{opacity:.45;cursor:default}
.dh small{display:block;font-weight:400;font-size:12px;opacity:.8}
.dh.today{background:var(--sel);color:var(--bg);border-radius:8px}
.cell.tcol{outline:2px solid color-mix(in srgb,var(--sel) 35%,transparent);outline-offset:1px}
.tab small{font-size:12px;padding:0 7px;border-radius:8px}
.tab.today small{background:var(--sel);color:var(--bg)}
.track{position:relative}
.tg{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);opacity:.75}
.edit-row input[type=number]{border:1px solid var(--line);background:var(--empty);color:inherit;border-radius:8px;padding:6px;font:inherit}
.fb{border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;background:var(--panel)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>My week</h1>
    <span class="hint" id="hint">Drag an activity into a box, or tap one and then tap boxes. Click a filled box to add a note.</span>
    <span class="sp"></span>
    <button id="undo" disabled>↩ Undo</button><button id="clear">Clear week</button><button id="bkb">Export / import</button>
  </header>

  <div class="bar">
    <div class="bar-top"><b>Activities</b><span class="sp" style="flex:1"></span><button id="toggleEdit">Edit activities</button></div>
    <div class="pal" id="pal"></div>
  </div>

  <div class="wk"><button id="wp" aria-label="Previous week">‹</button><b id="wl"></b><button id="wn" aria-label="Next week">›</button><button id="wt">This week</button><button id="wc">Copy last week</button></div>
  <div class="scroll"><div class="grid" id="grid"></div></div>

  <div class="stats"><h2>Where your week goes</h2><div class="hint" style="margin-bottom:6px">Set a weekly target per activity under Edit activities; a marker on the bar shows it.</div><div id="stats"></div></div>

  <div class="stats"><h2>Pillars</h2><div class="hint" style="margin-bottom:6px">Each box counts toward every pillar its activity strengthens.</div><div id="pillars"></div></div>
</div>

<div class="modal" id="modal" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt" style="font-size:16px;margin:0 0 10px"></h2><textarea id="mn" placeholder="Add a note, e.g. which songs, which session, who you’re meeting"></textarea><div class="mb"><button id="mrm">Remove from week</button><span style="flex:1"></span><button id="mc">Cancel</button><button id="ms">Save note</button></div></div></div>
<div style="display:none">
</div>

<script>
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var SEGS=['Morning 1','Morning 2','Lunch','Afternoon','Evening'];
var DEFAULT_CATS=[
 {id:'c1',e:'🎸',n:'Walk / park with guitar',c:'#2e9d5b'},
 {id:'c2',e:'💼',n:'Work (corporate)',c:'#3b6fd8'},
 {id:'c3',e:'🎵',n:'Work (music)',c:'#8a4fd6'},
 {id:'c4',e:'🏋️',n:'Gym / exercise',c:'#e5622e'},
 {id:'c5',e:'🛋️',n:'Social / recreation / relaxing',c:'#e0a21a'}
];
var PILLARS=[
 {id:'work',n:'Work',f:'Work',c:'#3b6fd8'},
 {id:'pp',n:'P&P',f:'Passion & pursuit (P&P)',c:'#8a4fd6'},
 {id:'ll',n:'L&L',f:'Life & love (L&L)',c:'#d6457a'},
 {id:'health',n:'Health',f:'Health',c:'#2e9d5b'}
];
var DEFAULT_P={c1:['pp','health'],c2:['work'],c3:['work','pp'],c4:['health'],c5:['ll']};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
var cats=DEFAULT_CATS.slice(), plan={}, notes={}, selected=null, editing=false, noteKey=null;
var weeks={}, targets={}, undoStack=[], wk=iso(monday(new Date()));
function dateOf(di){var p=wk.split('-');return new Date(+p[0],+p[1]-1,+p[2]+di);}
function isToday(di){return wk===iso(monday(new Date()))&&di===(new Date().getDay()+6)%7;}
function fmt(d){return DAYS[(d.getDay()+6)%7]+' '+d.getDate()+' '+MON[d.getMonth()];}
function syncWeek(){if(Object.keys(plan).length||Object.keys(notes).length)weeks[wk]={plan:plan,notes:notes};else delete weeks[wk];}
function data(){return {v:2,cats:cats,weeks:weeks,targets:targets};}
function renderWeekbar(){
  document.getElementById('wl').textContent=fmt(dateOf(0))+' – '+fmt(dateOf(6));
  document.getElementById('wt').disabled=(wk===iso(monday(new Date())));
}
function setWeek(w){
  syncWeek();wk=w;var o=weeks[wk]||{};plan=o.plan||{};notes=o.notes||{};
  undoStack=[];updateUndo();
  for(var i=0;i<7;i++)if(isToday(i))curDay=i;
  renderWeekbar();renderGrid();renderStats();
}
function shiftWeek(n){var d=dateOf(0);d.setDate(d.getDate()+7*n);setWeek(iso(d));}
function copyLast(){
  var d=dateOf(0);d.setDate(d.getDate()-7);
  var src=weeks[iso(d)];
  if(!src||!Object.keys(src.plan||{}).length){alert('Last week is empty.');return;}
  if(Object.keys(plan).length&&!confirm('Replace this week with last week’s plan?'))return;
  pushUndo();
  plan=JSON.parse(JSON.stringify(src.plan));notes=JSON.parse(JSON.stringify(src.notes||{}));
  save();renderGrid();renderStats();
}
function pushUndo(){undoStack.push(JSON.stringify({plan:plan,notes:notes}));if(undoStack.length>40)undoStack.shift();updateUndo();}
function updateUndo(){document.getElementById('undo').disabled=!undoStack.length;}
function undo(){
  if(!undoStack.length)return;
  var s=JSON.parse(undoStack.pop());plan=s.plan;notes=s.notes;
  save();renderGrid();renderStats();updateUndo();
}
function openBackup(){
  syncWeek();
  var m=document.createElement('div');m.className='modal';
  var box=document.createElement('div');box.className='box';
  box.innerHTML='<h2 style="font-size:16px;margin:0 0 8px">Export / import</h2><div class="hint" style="margin-bottom:8px">Copy or download this text to back up your plan, or to move it to another device. To restore, paste a backup here (or load a file) and press Import. Importing replaces everything currently here.</div><textarea id="bk" spellcheck="false"></textarea><div class="mb"><button id="bc">Copy</button><button id="bd">Download</button><label class="fb">Load file<input type="file" accept=".json,application/json" hidden></label><span style="flex:1"></span><button id="bx">Close</button><button id="bi">Import</button></div>';
  m.appendChild(box);document.body.appendChild(m);
  var ta=box.querySelector('#bk');ta.value=JSON.stringify(data());
  box.querySelector('#bx').onclick=function(){m.remove();};
  m.onclick=function(ev){if(ev.target===m)m.remove();};
  box.querySelector('#bc').onclick=function(){ta.select();try{navigator.clipboard.writeText(ta.value);}catch(e){document.execCommand('copy');}};
  box.querySelector('#bd').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ta.value],{type:'application/json'}));a.download='week-planner-backup.json';a.click();};
  box.querySelector('input[type=file]').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){ta.value=r.result;};r.readAsText(f);};
  box.querySelector('#bi').onclick=function(){
    try{
      var o=JSON.parse(ta.value);
      if(!o||!Array.isArray(o.cats)||typeof o.weeks!=='object')throw 0;
      if(!confirm('Replace everything with this backup?'))return;
      cats=o.cats;weeks=o.weeks||{};targets=o.targets||{};
      cats.forEach(function(c){if(!c.p)c.p=[];});
      var w=weeks[wk]||{};plan=w.plan||{};notes=w.notes||{};undoStack=[];
      save();m.remove();renderAll();updateUndo();
    }catch(e){alert('That doesn’t look like a valid backup.');}
  };
}

function load(){
  try{
    var s=localStorage.getItem('weekplanner.v1');
    if(s){var o=JSON.parse(s); if(o.cats&&o.cats.length)cats=o.cats; if(o.weeks){weeks=o.weeks;targets=o.targets||{};}else if(o.plan||o.notes){weeks[wk]={plan:o.plan||{},notes:o.notes||{}};}
      var w=weeks[wk]||{};plan=w.plan||{};notes=w.notes||{};}
  }catch(e){}
  cats.forEach(function(c){if(!c.p)c.p=(DEFAULT_P[c.id]||[]).slice();});
}
function save(){
  try{localStorage.setItem('weekplanner.v1',JSON.stringify((syncWeek(),data())));}catch(e){}
}
function cat(id){for(var i=0;i<cats.length;i++)if(cats[i].id===id)return cats[i];return null;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function renderPal(){
  var p=document.getElementById('pal');p.innerHTML='';p.className='pal'+(editing?' ed':'');
  if(editing){
    cats.forEach(function(c,i){
      var r=document.createElement('div');r.className='edit-row';
      r.innerHTML='<input type="text" class="em" maxlength="4" value="'+esc(c.e)+'" aria-label="Symbol">'+
        '<input type="text" class="nm" value="'+esc(c.n)+'" aria-label="Name">'+
        '<input type="color" value="'+c.c+'" aria-label="Colour">'+
        '<label class="pl" title="Boxes per week you are aiming for">Target <input type="number" min="0" max="35" style="width:56px" value="'+(targets[c.id]||'')+'"></label>'+
        '<span class="pl" title="Pillars this activity strengthens">'+PILLARS.map(function(p){return '<label><input type="checkbox" data-p="'+p.id+'"'+(c.p.indexOf(p.id)>-1?' checked':'')+'>'+p.n+'</label>';}).join('')+'</span>'+
        '<button aria-label="Delete activity">Delete</button>';
      var ins=r.querySelectorAll('input');
      ins[0].oninput=function(){c.e=this.value;save();renderGrid();renderStats();};
      ins[1].oninput=function(){c.n=this.value;save();renderGrid();renderStats();};
      ins[2].oninput=function(){c.c=this.value;save();renderGrid();renderStats();};
      r.querySelector('input[type=number]').oninput=function(){var v=parseInt(this.value,10);if(v>0)targets[c.id]=v;else delete targets[c.id];save();renderStats();};
      r.querySelectorAll('input[type=checkbox]').forEach(function(b){
        b.onchange=function(){
          var id=b.getAttribute('data-p'),i=c.p.indexOf(id);
          if(b.checked&&i<0)c.p.push(id);
          if(!b.checked&&i>-1)c.p.splice(i,1);
          save();renderStats();
        };
      });
      r.querySelector('button').onclick=function(){
        cats.splice(i,1);
        delete targets[c.id];for(var k in plan)if(plan[k]===c.id){delete plan[k];delete notes[k];}
        if(selected===c.id)selected=null;
        save();renderAll();
      };
      p.appendChild(r);
    });
    var add=document.createElement('button');add.textContent='Add activity';
    add.onclick=function(){cats.push({id:'c'+Date.now(),e:'⭐',n:'New activity',c:'#d6457a',p:[]});save();renderAll();};
    p.appendChild(add);
  }else{
    cats.forEach(function(c){
      var d=document.createElement('div');
      d.className='chip'+(selected===c.id?' sel':'');
      d.style.setProperty('--c',c.c);d.draggable=true;d.tabIndex=0;
      d.innerHTML='<span class="e">'+esc(c.e)+'</span><span>'+esc(c.n)+'</span>';
      d.ondragstart=function(ev){ev.dataTransfer.setData('text/plain','cat:'+c.id);ev.dataTransfer.effectAllowed='copy';};
      d.onclick=function(){selected=(selected===c.id?null:c.id);renderPal();};
      d.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();d.onclick();}};
      p.appendChild(d);
    });
  }
}

function renderGridDesktop(){
  var g=document.getElementById('grid');g.innerHTML='';
  g.appendChild(document.createElement('div'));
  DAYS.forEach(function(d,di){var h=document.createElement('div');h.className='dh'+(isToday(di)?' today':'');h.innerHTML=d+'<small>'+dateOf(di).getDate()+' '+MON[dateOf(di).getMonth()]+'</small>';g.appendChild(h);});
  SEGS.forEach(function(sn,si){
    var l=document.createElement('div');l.className='sh';l.textContent=sn;g.appendChild(l);
    DAYS.forEach(function(dn,di){
      var key=di+'-'+si, c=cat(plan[key]);
      var cell=document.createElement('div');
      cell.className='cell'+(c?' full':'')+(isToday(di)?' tcol':'');
      cell.setAttribute('aria-label',dn+' '+sn+(c?': '+c.n:': empty'));
      if(c){
        cell.style.setProperty('--c',c.c);cell.draggable=true;
        cell.innerHTML='<div><span class="e">'+esc(c.e)+'</span><span class="n">'+esc(c.n)+'</span>'+(notes[key]?'<span class="nb" title="'+esc(notes[key])+'">'+esc(notes[key])+'</span>':'')+'</div>'+(notes[key]?'<span class="nt" title="'+esc(notes[key])+'">📝</span>':'');
        cell.ondragstart=function(ev){ev.dataTransfer.setData('text/plain','cell:'+key);ev.dataTransfer.effectAllowed='move';};
      }
      cell.ondragover=function(ev){ev.preventDefault();cell.classList.add('over');};
      cell.ondragleave=function(){cell.classList.remove('over');};
      cell.ondrop=function(ev){
        ev.preventDefault();cell.classList.remove('over');
        var t=ev.dataTransfer.getData('text/plain')||'';pushUndo();
        if(t.indexOf('cat:')===0){plan[key]=t.slice(4);}
        else if(t.indexOf('cell:')===0){
          var from=t.slice(5);if(from===key)return;
          var mn=notes[key];if(notes[from])notes[key]=notes[from];else delete notes[key];if(mn)notes[from]=mn;else delete notes[from];
          var mine=plan[key];plan[key]=plan[from];
          if(mine)plan[from]=mine;else delete plan[from];
        }
        save();renderGrid();renderStats();
      };
      cell.onclick=function(){
        if(selected){pushUndo();plan[key]=selected;}
        else if(plan[key]){openNote(key);return;}
        else return;
        save();renderGrid();renderStats();
      };
      g.appendChild(cell);
    });
  });
}

var FULLDAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var curDay=(new Date().getDay()+6)%7;
function isMob(){try{return window.matchMedia('(max-width:700px)').matches;}catch(e){return false;}}
function renderGrid(){
  var g=document.getElementById('grid');
  if(!isMob()){g.className='grid';renderGridDesktop();return;}
  g.className='mday';g.innerHTML='';
  var tabs=document.createElement('div');tabs.className='tabs';
  DAYS.forEach(function(dn,di){
    var b=document.createElement('button');b.className='tab'+(di===curDay?' on':'')+(isToday(di)?' today':'');
    var dots='';
    for(var si=0;si<SEGS.length;si++){var c=cat(plan[di+'-'+si]);dots+='<i style="background:'+(c?c.c:'var(--line)')+'"></i>';}
    b.innerHTML='<b>'+dn+'</b><small>'+dateOf(di).getDate()+'</small><span class="dots">'+dots+'</span>';
    b.onclick=function(){curDay=di;renderGrid();};
    tabs.appendChild(b);
  });
  g.appendChild(tabs);
  var t=document.createElement('div');t.className='dtitle';
  t.innerHTML='<button aria-label="Previous day">‹</button><b>'+FULLDAYS[curDay]+' '+dateOf(curDay).getDate()+' '+MON[dateOf(curDay).getMonth()]+(isToday(curDay)?' · Today':'')+'</b><button aria-label="Next day">›</button>';
  var tb=t.querySelectorAll('button');
  tb[0].onclick=function(){curDay=(curDay+6)%7;renderGrid();};
  tb[1].onclick=function(){curDay=(curDay+1)%7;renderGrid();};
  g.appendChild(t);
  SEGS.forEach(function(sn,si){
    var key=curDay+'-'+si,c=cat(plan[key]);
    var row=document.createElement('div');row.className='mrow';
    row.innerHTML='<div class="ml">'+sn+'</div>';
    var cell=document.createElement('div');cell.className='mcell'+(c?' full':'');
    if(c){
      cell.style.setProperty('--c',c.c);
      cell.innerHTML='<span class="e">'+esc(c.e)+'</span><div><b>'+esc(c.n)+'</b>'+(notes[key]?'<div class="mn">'+esc(notes[key])+'</div>':'')+'</div>';
    }else{cell.textContent=selected?'Tap to add':'Tap to choose';}
    cell.onclick=function(){
      if(selected){pushUndo();plan[key]=selected;save();renderGrid();renderStats();}
      else if(plan[key]){openNote(key);}
      else{openPicker(key);}
    };
    row.appendChild(cell);g.appendChild(row);
  });
}
function openPicker(key){
  var parts=key.split('-');
  var m=document.createElement('div');m.className='modal sheet';
  var box=document.createElement('div');box.className='box';
  box.innerHTML='<h2 style="font-size:16px;margin:0 0 10px">'+FULLDAYS[+parts[0]]+' · '+SEGS[+parts[1]]+'</h2>';
  cats.forEach(function(c){
    var b=document.createElement('button');b.className='pbtn';b.style.setProperty('--c',c.c);
    b.innerHTML='<span class="e">'+esc(c.e)+'</span><span>'+esc(c.n)+'</span>';
    b.onclick=function(){pushUndo();plan[key]=c.id;save();m.remove();renderGrid();renderStats();};
    box.appendChild(b);
  });
  var x=document.createElement('button');x.textContent='Cancel';x.style.width='100%';x.onclick=function(){m.remove();};
  box.appendChild(x);
  m.onclick=function(ev){if(ev.target===m)m.remove();};
  m.appendChild(box);document.body.appendChild(m);
}
function renderStats(){
  var s=document.getElementById('stats');s.innerHTML='';
  var total=DAYS.length*SEGS.length, counts={}, used=0;
  for(var k in plan){if(cat(plan[k])){counts[plan[k]]=(counts[plan[k]]||0)+1;used++;}}
  cats.forEach(function(c){
    var n=counts[c.id]||0, r=document.createElement('div');r.className='srow';
    r.innerHTML='<span>'+esc(c.e)+' '+esc(c.n)+'</span><div class="track"><div class="fill" style="--c:'+c.c+';width:'+(n/total*100)+'%"></div>'+(targets[c.id]?'<i class="tg" style="left:'+Math.min(100,targets[c.id]/total*100)+'%"></i>':'')+'</div><span>'+(targets[c.id]?(n>=targets[c.id]?'✓ ':'')+n+' / '+targets[c.id]:n+' / '+total)+'</span>';
    s.appendChild(r);
  });
  var f=document.createElement('div');f.className='hint';f.style.marginTop='8px';
  f.textContent=(total-used)+' boxes still empty';s.appendChild(f);
  renderPillars();
}

function renderPillars(){
  var el=document.getElementById('pillars');el.innerHTML='';
  var total=DAYS.length*SEGS.length;
  PILLARS.forEach(function(p){
    var n=0;
    for(var k in plan){var c=cat(plan[k]);if(c&&c.p.indexOf(p.id)>-1)n++;}
    var r=document.createElement('div');r.className='srow';
    r.innerHTML='<span>'+esc(p.f)+'</span><div class="track"><div class="fill" style="--c:'+p.c+';width:'+(n/total*100)+'%"></div></div><span>'+n+' / '+total+'</span>';
    el.appendChild(r);
  });
}
function openNote(key){
  var c=cat(plan[key]);if(!c)return;
  var parts=key.split('-');
  noteKey=key;
  document.getElementById('mt').textContent=c.e+' '+c.n+' · '+DAYS[+parts[0]]+' '+SEGS[+parts[1]];
  document.getElementById('mn').value=notes[key]||'';
  document.getElementById('modal').hidden=false;
  document.getElementById('mn').focus();
}
function closeNote(){document.getElementById('modal').hidden=true;noteKey=null;}
document.getElementById('mc').onclick=closeNote;
document.getElementById('modal').onclick=function(ev){if(ev.target===this)closeNote();};
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&noteKey)closeNote();});
document.getElementById('ms').onclick=function(){
  var v=document.getElementById('mn').value.trim();pushUndo();
  if(v)notes[noteKey]=v;else delete notes[noteKey];
  save();closeNote();renderGrid();
};
document.getElementById('mrm').onclick=function(){
  pushUndo();delete plan[noteKey];delete notes[noteKey];
  save();closeNote();renderGrid();renderStats();
};
function renderAll(){renderPal();renderWeekbar();renderGrid();renderStats();}

document.getElementById('toggleEdit').onclick=function(){
  editing=!editing;selected=null;this.textContent=editing?'Done editing':'Edit activities';
  document.getElementById('hint').textContent=editing?'Change symbols, names and colours, or add new activities.':'Drag an activity into a box, or tap one and then tap boxes. Click a filled box to add a note.';
  renderPal();
};
document.getElementById('clear').onclick=function(){
  if(Object.keys(plan).length&&confirm('Clear every box in the week?')){pushUndo();plan={};notes={};save();renderGrid();renderStats();}
};
try{window.matchMedia('(max-width:700px)').addEventListener('change',renderGrid);}catch(e){}
document.getElementById('wp').onclick=function(){shiftWeek(-1);};
document.getElementById('wn').onclick=function(){shiftWeek(1);};
document.getElementById('wt').onclick=function(){setWeek(iso(monday(new Date())));};
document.getElementById('wc').onclick=copyLast;
document.getElementById('undo').onclick=undo;
document.getElementById('bkb').onclick=openBackup;
document.addEventListener('keydown',function(ev){
  if((ev.metaKey||ev.ctrlKey)&&ev.key==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ev.preventDefault();undo();}
});
load();renderAll();updateUndo();
</script>
</body>
</html>
